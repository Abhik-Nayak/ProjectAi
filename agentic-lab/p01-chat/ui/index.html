<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b;
           height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e4e4e7; font-weight: 600; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #fff; border: 1px solid #e4e4e7; }
    form { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #e4e4e7; }
    textarea { flex: 1; resize: none; padding: 10px; border: 1px solid #d4d4d8; border-radius: 8px; font: inherit; }
    button { padding: 0 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .copy { display: block; margin-top: 8px; padding: 4px 10px; font-size: 12px;
            background: #f4f4f5; color: #3f3f46; border: 1px solid #e4e4e7; border-radius: 6px; }
  </style>
</head>
<body>
  <header>Local Chat · qwen2.5:7b</header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = []; // full history sent to the server each turn

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function addCopyButton(bubble, text) {
      const btn = document.createElement("button");
      btn.className = "copy";
      btn.type = "button";
      btn.textContent = "Copy";
      btn.onclick = async () => {
        await navigator.clipboard.writeText(text);
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = "Copy"), 1500);
      };
      bubble.appendChild(btn);
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      send.disabled = true;
      messages.push({ role: "user", content: text });
      addBubble("user", text);
      const bubble = addBubble("assistant", "…");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let reply = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          reply += dec.decode(value, { stream: true });
          bubble.textContent = reply;
          log.scrollTop = log.scrollHeight;
        }
        messages.push({ role: "assistant", content: reply });
        addCopyButton(bubble, reply);
      } catch (err) {
        bubble.textContent = "Error: " + err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
